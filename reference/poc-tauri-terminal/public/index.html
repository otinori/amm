<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>poc-tauri-terminal</title>
<link rel="stylesheet" href="xterm.css" />
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; font-family: system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #pane-area { flex: 1; padding: 8px; min-height: 0; }
  #terminal { height: 100%; }
  #input-bar { display: flex; gap: 6px; padding: 6px 8px; background: #252526; border-top: 1px solid #3c3c3c; }
  #quick-switch { display: flex; gap: 4px; }
  .qs-btn { padding: 2px 8px; border-radius: 4px; border: 1px solid #555; background: #3a3a3a; color: #ddd; font-size: 12px; cursor: pointer; }
  .qs-btn.idle { background: #6b6320; }
  .qs-btn.running { background: #3a3a3a; }
  .qs-btn.waiting-approval { background: #a35a1a; }
  #prompt-input { flex: 1; background: #1e1e1e; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font-family: inherit; }
  #status-bar { padding: 2px 8px; font-size: 11px; color: #999; background: #1e1e1e; }
</style>
</head>
<body>
<div id="app">
  <div id="pane-area"><div id="terminal"></div></div>
  <div id="input-bar">
    <div id="quick-switch">
      <button class="qs-btn idle">[Ctrl+1] ● claude</button>
      <button class="qs-btn running">[Ctrl+2] ⚙ codex</button>
      <button class="qs-btn waiting-approval">[Ctrl+3] ⚠ copilot</button>
    </div>
    <input id="prompt-input" placeholder="共通入力欄 (PoC: 未接続)" />
  </div>
  <div id="status-bar">送信先: claude (アクティブ) — poc-tauri-terminal (xterm.js + node-pty over ws)</div>
</div>

<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-unicode11.js"></script>
<script>
  const term = new Terminal({
    fontFamily: 'Cascadia Code, Consolas, monospace',
    fontSize: 14,
    theme: { background: '#1e1e1e', foreground: '#d4d4d4' },
    allowProposedApi: true,
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.loadAddon(new Unicode11Addon.Unicode11Addon());
  term.unicode.activeVersion = '11';
  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  const ws = new WebSocket(`ws://${location.host}/pty`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'data') term.write(msg.data);
  };
  term.onData((data) => {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data }));
  });

  window.addEventListener('resize', () => {
    fitAddon.fit();
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  });

  window.__pocTerm = term;
</script>
</body>
</html>
