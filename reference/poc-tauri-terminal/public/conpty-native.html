<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>conpty-native</title>
<link rel="stylesheet" href="xterm.css" />
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; display: flex; flex-direction: column; }
  #terminal { flex: 1; min-height: 0; padding: 4px; box-sizing: border-box; }
  #sysmenu-log { flex: 0 0 auto; padding: 4px 8px; font: 12px/1.4 Consolas, monospace; color: #9cdcfe; background: #252526; border-top: 1px solid #3c3c3c; min-height: 1.4em; }
  #toolbar { flex: 0 0 auto; padding: 4px 8px; background: #252526; border-top: 1px solid #3c3c3c; }
  #toolbar button { padding: 3px 10px; border-radius: 4px; border: 1px solid #555; background: #3a3a3a; color: #ddd; cursor: pointer; font-size: 12px; }
  #input-bar { flex: 0 0 auto; display: flex; gap: 6px; padding: 6px 8px; background: #252526; border-top: 1px solid #3c3c3c; }
  #prompt-input { flex: 1; background: #1e1e1e; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font-family: inherit; }
  #ime-log { flex: 0 0 auto; padding: 4px 8px; font: 11px/1.4 Consolas, monospace; color: #ce9178; background: #252526; border-top: 1px solid #3c3c3c; max-height: 5.6em; overflow-y: auto; }
</style>
</head>
<body>
<div id="terminal"></div>
<div id="input-bar">
  <input id="prompt-input" placeholder="共通入力欄(IME確定後Enterでptyへ送信)" />
</div>
<div id="toolbar">
  <button id="btn-flash">タスクバー点滅(FlashWindowEx)</button>
  <button id="btn-approval">承認ハブ表示(常時最前面/非アクティブ化)</button>
</div>
<div id="sysmenu-log">システムメニュー[AMM ▶]からの通知待ち…(タイトルバーアイコンを右クリック、またはAlt+Space)</div>
<div id="ime-log"></div>

<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;

  const term = new Terminal({
    fontFamily: 'Cascadia Code, Consolas, monospace',
    fontSize: 14,
    theme: { background: '#1e1e1e', foreground: '#d4d4d4' },
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  listen('pty-data', (event) => term.write(event.payload));
  term.onData((data) => invoke('pty_write', { data }));
  window.addEventListener('resize', () => {
    fitAddon.fit();
    invoke('pty_resize', { cols: term.cols, rows: term.rows });
  });

  invoke('pty_spawn').then(() => {
    invoke('pty_resize', { cols: term.cols, rows: term.rows });
  });

  document.getElementById('btn-flash').addEventListener('click', () => invoke('flash_window'));
  document.getElementById('btn-approval').addEventListener('click', () => invoke('show_approval_popup'));

  const promptInput = document.getElementById('prompt-input');
  promptInput.addEventListener('keydown', (e) => {
    // Ignore the Enter that merely confirms an IME composition (isComposing),
    // so a single "confirm kanji" Enter doesn't also submit the line.
    if (e.key === 'Enter' && !e.isComposing) {
      const value = promptInput.value;
      invoke('pty_write', { data: value + '\r' });
      imeLog(`SUBMIT via #prompt-input: '${value}'`);
      promptInput.value = '';
    }
  });

  // Instrument every composition/input event across the whole page (capture
  // phase) to see whether the two separate input surfaces (prompt bar vs.
  // xterm's hidden textarea) ever cross-fire or double-commit the same text -
  // the failure mode the current WinForms TextBox+WebView2 split exhibits.
  let imeSeq = 0;
  function imeLog(msg) {
    const el = document.getElementById('ime-log');
    const line = document.createElement('div');
    line.textContent = `[${++imeSeq}] ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }
  for (const type of ['compositionstart', 'compositionupdate', 'compositionend']) {
    document.addEventListener(type, (e) => {
      const tag = e.target.tagName + (e.target.id ? '#' + e.target.id : '');
      imeLog(`${type} on ${tag}: '${e.data ?? ''}'`);
    }, true);
  }

  listen('amm-system-menu-clicked', (event) => {
    const now = new Date().toLocaleTimeString('ja-JP');
    document.getElementById('sysmenu-log').textContent =
      `[${now}] システムメニュー[AMM ▶]から受信: ${event.payload}`;
  });

  window.__pocTerm = term;
</script>
</body>
</html>
