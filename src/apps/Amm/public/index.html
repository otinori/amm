<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>amm</title>
<link rel="stylesheet" href="xterm.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button id="btn-file-menu">ファイル ▶</button>
    <button id="btn-command-menu">コマンド ▶</button>
    <button id="btn-tile" title="ドラッグで変えた並び順を起動順に戻し、未起動の自動起動プロファイルを補充する">並び順をリセット</button>
    <span style="flex:1"></span>
    <button id="btn-general-settings-menu">設定 ▶</button>
    <button id="btn-settings-menu">AI設定 ▶</button>
    <button id="btn-approval-test">承認一覧を表示</button>
    <button id="toggle-quick-switch-bar">切替バー表示</button>
    <button id="toggle-input-row">入力欄表示</button>
    <button id="toggle-status-line">ステータス表示</button>
  </div>
  <div id="desk"></div>
  <div id="bottom-panel">
    <div id="quick-switch-bar"></div>
    <div id="input-row" style="position:relative">
      <textarea id="prompt-input" placeholder="共通入力欄 (Ctrl+S: アクティブへ送信 / Ctrl+Shift+S: 全ペイン送信 / Ctrl+1-9: 番号指定送信 / Ctrl+H: 送信履歴 / Esc連打: 入力欄をクリア / Enterは改行のみ)"></textarea>
      <div id="history-dropdown" class="hidden"></div>
    </div>
    <div id="status-line">送信先: (なし)</div>
  </div>
  <div id="approval-overlay" class="approval-overlay hidden">
    <div id="approval-count" class="approval-count"></div>
    <div id="approval-tool" class="approval-tool"></div>
    <div id="approval-input" class="approval-input"></div>
    <div class="approval-buttons">
      <button id="approval-allow" class="approval-allow" disabled>はい</button>
      <button id="approval-goto-pane" class="approval-confirm" disabled>確認</button>
    </div>
  </div>
  <div id="attention-overlay" class="approval-overlay attention-overlay hidden">
    <div id="attention-count" class="approval-count"></div>
    <div id="attention-tool" class="approval-tool"></div>
    <button id="attention-confirm" class="approval-confirm">確認</button>
  </div>
</div>

<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-unicode11.js"></script>
<!--
  app.js (2026-07-26 architecture-bloat cleanup, review finding: single
  3429-line file, no internal module boundaries) split into 7 classic
  scripts sharing one global scope. Load order below must match the
  original file's top-to-bottom order exactly - later scripts reference
  functions/consts declared earlier (safe: all real cross-references
  happen inside callbacks/listeners that only run after every script here
  has finished loading, not at top-level parse time).
-->
<script src="pane-layout.js"></script>
<script src="pane-lifecycle.js"></script>
<script src="send-helpers.js"></script>
<script src="dialogs-quick-stats.js"></script>
<script src="dialogs-profile-mcp.js"></script>
<script src="input-history.js"></script>
<script src="events-integration.js"></script>
</body>
</html>
