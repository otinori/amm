[package]
name = "amm"
version = "1.2.0"
description = "amm: Windows-native multi-AI-CLI multiplexer"
authors = ["otinori"]
license = "Apache-2.0"
repository = "https://github.com/otinori/amm"
edition = "2021"
rust-version = "1.77.2"
# spec: `cargo tauri build`がamm(GUI本体)をamm-mcp(CLIブリッジ)の中身で上書き
# する既知の破損バグの根本修正。tauri-cli 2.11.4のRustAppSettings::
# get_binaries()(src/interface/rust.rs)を実際に追跡したところ、[[bin]]も
# default-runも無いCargo.tomlではsrc/bin/*とsrc/main.rsの両方がis_main=false
# のまま登録され、2つ以上の候補があるケースはmatch binaries.len() { 0=>.., 1=>..,
# _=>{} }のno-op分岐に落ちてどちらが「メイン」か決定されない(tauri-cli自身の
# エラーメッセージ「make sure you have a package > default-run」がまさにこの
# ケースを指している)。default-runを明示することでこの曖昧さを解消する。
default-run = "amm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "amm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
notify-rust = "4.18"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
